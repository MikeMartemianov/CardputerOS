; CardputerOS - PlatformIO Configuration
; M5Stack Cardputer (ESP32-S3FN8)

[env:cardputer]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 115200
upload_verify = false
monitor_speed = 115200

; Build flags
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1

; Libraries
lib_deps =
    M5Cardputer=https://github.com/m5stack/M5Cardputer

; Build type
build_type = release

; Monitor filters
monitor_filters = esp32_exception_decoder
